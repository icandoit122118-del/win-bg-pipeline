[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "win-bg-pipeline"
version = "1.0.0"
description = "Multi-Stage Windows Background Screen Capture & Input Automation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "icandoit122118-del"}
]
dependencies = [
  "psutil>=5.9.0"
]

[project.scripts]
win-bg-pipeline = "win_bg_pipeline.cli:main"
